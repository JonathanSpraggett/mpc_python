[build-system]
requires = ["setuptools>=64"]
#build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mpc-python"
version = "0.1.0"
description = "Model Predictive Control for path-following problems"
requires-python = ">=3.10"
dependencies = [
    "numpy<2",
    "matplotlib",
    "mujoco",
    "cvxpy",
    "scipy",
    "osqp",
    "sympy",
    "pyyaml",
    "scipy-stubs",
    "ipykernel>=7.3.0",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4",
    "ipython",
    "ipywidgets",
    "nbformat",
    "nbconvert",
]
dev = [
    "black>=24",
    "ruff",
]

[project.scripts]
holonomic_mpc_node = "mpc_python.holonomic_mpc_node:main"

[tool.setuptools.package-data]
mpc_python = ["config/*.yaml"]

[tool.setuptools.packages.find]
where = ["."]
